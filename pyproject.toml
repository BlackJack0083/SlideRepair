[project]
name = "slide-repair"
version = "0.1.0"
description = "SlideGuard method and evaluation code for the SlideRepair benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.6.7",
    "loguru>=0.7.3",
    "openai>=2.6.1",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "python-pptx>=1.0.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.45",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
